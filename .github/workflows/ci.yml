# SPDX-License-Identifier: GPL-3.0-only
# CI de EPICYKLOS: pruebas, emulador (y su publicación en GitHub Pages) y firmware de desarrollo para el FM-1.
# Nothing here flashes a device (nada de esto instala en un FM-1).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld libfribidi0
      - run: pip install -q pillow fonttools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Host simulator + headless emulator (simulador y emulador sin navegador)
        run: sh tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: emulator
          path: app/build/emu/
      - uses: actions/upload-artifact@v4
        with:
          name: headless-screens
          path: app/build/headless/

  cpp-smoke:
    # Does JieLi's clang 4.0.1 for pi32v2 compile our C++ subset? (prueba de C++ con el compilador del FM-1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sh base/tools/get_toolchain.sh "$HOME/.jieli"
      - run: sh tests/cpp_smoke/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-smoke
          path: tests/cpp_smoke/out/

  firmware:
    # A development build of the .fwsc (compilación de desarrollo, sin firmar; NO es una release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0
      - run: pip install -q pillow fonttools
      - name: JieLi toolchain
        run: |
          sh base/tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$(readlink -f "$HOME/.jieli/toolchain")" >> "$GITHUB_ENV"
      - name: JieLi AC79 SDK (gitee, fixed tag, as zvenson/fm1-build does)
        run: |
          for i in 1 2 3; do
            git clone -q --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && break
            rm -rf "$HOME/fw-AC79_AIoT_SDK"; sleep 20
          done
          test -f "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot"
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - run: ./build.sh
      - name: Size report (memoria usada)
        run: ls -l app/build/*.fwsc app/build/*.bin; ls app/build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-dev
          path: |
            app/build/*.fwsc
            app/build/*.bin
            app/build/*.txt
            firmware.json
