# SPDX-License-Identifier: GPL-3.0-only
# EPICYKLOS para el ordenador: plugin VST3 / AU y app independiente para macOS (Apple Silicon e Intel).
# Manual o al cambiar desktop/. No publica nada: deja un zip en la propia ejecución (artifact).
name: Desktop

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner de macOS'
        default: 'macos-15'
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure (configurar)
        run: cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build (compilar)
        run: cmake --build desktop/build --config Release
      - name: What was built (lo construido)
        run: |
          cd desktop/build/Epicyklos_artefacts/Release
          find . -maxdepth 3 -name "*.vst3" -o -maxdepth 3 -name "*.component" -o -maxdepth 3 -name "*.app" | sort
          lipo -archs "VST3/EPICYKLOS.vst3/Contents/MacOS/EPICYKLOS"
          codesign -dv "VST3/EPICYKLOS.vst3" 2>&1 | head -5 || true
      - name: Sign ad hoc and pack (firma local y zip)
        run: |
          cd desktop/build/Epicyklos_artefacts/Release
          for b in VST3/EPICYKLOS.vst3 AU/EPICYKLOS.component Standalone/EPICYKLOS.app; do codesign --force --deep -s - "$b"; done
          mkdir -p pack && cp -R VST3/EPICYKLOS.vst3 AU/EPICYKLOS.component Standalone/EPICYKLOS.app pack/
          cp ../../../LEEME.txt pack/
          cd pack && ditto -c -k --keepParent . ../EPICYKLOS-mac.zip
      - name: Validate the Audio Unit as a host would (auval la carga, la hace sonar y guarda su estado)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R desktop/build/Epicyklos_artefacts/Release/AU/EPICYKLOS.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Epik Cykl 2>&1 | tail -40
          auval -v aumu Epik Cykl >/dev/null 2>&1
      - name: Validate the VST3 with pluginval (best effort)
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            desktop/build/Epicyklos_artefacts/Release/VST3/EPICYKLOS.vst3 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: epicyklos-desktop-mac
          path: desktop/build/Epicyklos_artefacts/Release/EPICYKLOS-mac.zip
          if-no-files-found: error
